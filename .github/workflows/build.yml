name: Build Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller sc64deployer_gui.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sc64deployer_gui-windows
          path: dist/sc64deployer_gui.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller sc64deployer_gui.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sc64deployer_gui-linux
          path: dist/sc64deployer_gui

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller sc64deployer_gui.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sc64deployer_gui-macos
          path: dist/sc64deployer_gui

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Package artifacts
        run: |
          cd sc64deployer_gui-windows && zip ../sc64deployer_gui-windows.zip sc64deployer_gui.exe && cd ..
          cd sc64deployer_gui-linux && chmod +x sc64deployer_gui && tar czf ../sc64deployer_gui-linux.tar.gz sc64deployer_gui && cd ..
          cd sc64deployer_gui-macos && chmod +x sc64deployer_gui && zip ../sc64deployer_gui-macos.zip sc64deployer_gui && cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sc64deployer_gui-windows.zip
            sc64deployer_gui-linux.tar.gz
            sc64deployer_gui-macos.zip
